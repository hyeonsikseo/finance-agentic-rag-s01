# 법령·제도 상수표
#
# 여기 있는 값은 "문서에서 검색해 오는 값"이 아니라 "법령이 정한 상수"다.
# 계산 Tool 은 이 파일에서 값을 읽고, 답변에는 반드시
#   "세율·한도는 법령 상수(as_of 기준)이며 검색된 문서의 근거가 아닙니다"
# 를 함께 표기한다. 문서에서 읽어야 할 값(이율·수수료율·차감률)은 절대 여기 두지 않는다.
#
# 갱신 원칙: 값을 바꿀 때는 as_of 와 source 를 함께 고친다. 과거 값은 지우지 말고
# superseded 로 남긴다(과거 시행일 기준 질문의 정답이 달라지기 때문).

meta:
  as_of: "2026-09-07"
  maintainer: "강사"
  review_cycle: "분기 1회"
  disclaimer: "법령 상수. 문서 근거 아님. 실제 적용은 금융회사·세무 상담 확인 필요."

# ── 세금 ────────────────────────────────────────────────────────────────
tax:
  interest_income:
    total_rate: 0.154
    components:
      income_tax: 0.14          # 소득세법 제129조
      local_income_tax: 0.014   # 지방세법(소득세의 10%)
    rounding_note: |
      15.4% 를 한 번에 적용해 원 미만 절사한 값과, 소득세 14% 를 절사한 뒤 그 값의 10% 를
      다시 절사해 더한 값은 1~2원 다를 수 있다. 골든셋은 두 규칙을 rounding_rule 필드로
      구분해 저장하고, 단일 정답을 강요하지 않는다.
    variants:
      lump_truncate: "이자 × 0.154 → 원 미만 절사"
      per_component_truncate: "이자 × 0.14 절사 + (그 값 × 0.10) 절사"
    source: "소득세법 제129조, 지방세법 제103조의3"
    as_of: "2026-09-07"

  preferential_9_5:
    rate: 0.095
    status: "legacy"
    note: "세금우대종합저축. 신규 가입 종료된 제도이나 과거 문서에 남아 있어 문항 근거로만 쓴다."
    source: "구 조세특례제한법 제89조"

  tax_free_comprehensive_savings:
    limit_krw: 50000000
    rate: 0.0
    sunset: "2028-12-31"
    eligibility: "만 65세 이상, 장애인, 국가유공자 등"
    source: "조세특례제한법 제88조의2"
    as_of: "2026-09-07"

  soldier_savings:
    rate: 0.0
    note: "장병내일준비적금 이자소득 비과세. 농협 설명서의 비과세 표기 근거."
    source: "조세특례제한법 제91조의19"
    as_of: "2026-09-07"

# ── 금리 상한 ───────────────────────────────────────────────────────────
interest_caps:
  legal_max_rate: 0.20
  legal_max_source: "이자제한법·대부업법 시행령(연 20%)"
  legal_max_as_of: "2026-09-07"
  note: |
    산출된 이자율이 법정최고를 넘으면 20% 로 캡한다(Q11: 18% + 3%p = 21% → 20%).
    캡이 적용됐다는 사실 자체를 답변에 명시한다.

delinquency:
  add_on_rate: 0.03
  add_on_note: "약정이자율 + 3%p. 2018.4.30 이후 여신금융기관 공통."
  add_on_source: "여신전문금융업 감독규정 개정(2018.4.30 시행)"
  # 은행별 상한은 법령 상수가 아니라 각 은행 약관·설명서에 적힌 값이다.
  # 여기 둔 것은 "문서에 상한이 공란일 때 무엇을 확인해야 하는지" 보여주기 위한 참고표이며,
  # 계산 Tool 은 반드시 해당 문서에서 읽은 값을 쓴다.
  bank_caps_reference:
    woori_household: 0.12
    woori_corporate: 0.15
    hana: 0.15
    im_bank: null        # 설명서에 공란 → 파라미터 누락 분기 대상
  bank_caps_note: "참고값. 문서에서 읽지 못하면 확인 요청으로 분기한다."

# ── 예금자보호 ──────────────────────────────────────────────────────────
depositor_protection:
  limit_krw: 100000000
  effective_from: "2025-09-01"
  previous:
    limit_krw: 50000000
    superseded_on: "2025-09-01"
  scope_note: "금융회사별·1인당 원금과 소정이자 합산. 보호 대상 상품 여부는 문서에서 확인."
  source: "예금자보호법 시행령"
  as_of: "2026-09-07"

# ── 계산 규칙 파라미터 ──────────────────────────────────────────────────
# 이 값들이 답을 바꾼다. Tool 시그니처에 명시 파라미터로 넣고, 문서에서 규칙을
# 읽지 못하면 기본값을 쓰되 "어떤 규칙을 가정했는지"를 답변에 적는다.
calc_rules:
  rounding:
    default: truncate_won         # 원 미만 절사
    options: [truncate_won, round_won, floor_10won]
  rate_precision:
    default: 3                    # 이율 소수 셋째자리
    mode: truncate                # 농협 설명서 "소수점 셋째자리 미만 절사"
  month_counting:
    default: floor                # 월 미만 버림
    options: [floor, ceil, exact_days]
  day_count:
    default: act_365
    options: [act_365, act_366, act_365_fixed]
    leap_year_aware: true
    note: |
      윤년이 답을 바꾼 실례: 하나은행 주담대 중도상환해약금 466,666원(365 기준) /
      467,518원(366 기준). 3년 만기는 1095 또는 1096.
  installment_convention:
    woori: "(할부개월수 + 1) / 2 / 12"       # 우리은행 금융계산기 관행
    sc: "잔여원금 × 이용일수 / 365"          # 결제일별 일수 필요
    note: "관행이 2종이라 어느 쪽인지 지정하지 않으면 계산 불가. 파라미터로 요구한다."

# ── 실손 세대 구분 ──────────────────────────────────────────────────────
silson_generations:
  # 2026-09-08 확인: 법제처 별표15 현행본은 5세대 구조(개정 이력에 2025.6.30·2026.5.6 포함).
  # 4세대 본문은 sonsa_silson_std_2024(2024.12.20 시행 게시본)에서 확인.
  gen4:
    effective_from: "2024-12-20"
    basis_doc: "sonsa_silson_std_2024"
    outpatient_deductible_covered:
      의원급: "max(1만원, 보장대상의료비의 20%)"
      종합병원·상급종합: "max(2만원, 보장대상의료비의 20%)"
    noncovered:
      통원: "max(3만원, 보장대상의료비의 30%) 공제, 연 100회"
      입원: "70% 보상"
    note: "급여 공제 항목이 2개(정액, 20%)."
  gen5:
    effective_from: "2026-05-06"
    basis_doc: "law_silson_std_pdf"
    outpatient_deductible_covered:
      의원급: "max(1만원, 보장대상의료비의 20%, 보장대상의료비 × 건강보험본인부담률)"
      종합병원·상급종합: "max(2만원, 보장대상의료비의 20%, 보장대상의료비 × 건강보험본인부담률)"
    copay_rate_note: "건강보험본인부담률 = 급여 일부본인부담금 ÷ (급여 일부본인부담금 + 급여 공단부담금). 영수증에서 읽는다. 문서에 없으면 입력으로 받는다."
    special1_severe_noncovered:
      통원: "max(3만원, 30%) 공제"
      입원: "70% 보상"
    special2_nonsevere_noncovered:
      통원: "max(5만원, 50%) 공제"
      입원: "50% 보상, 1회당 300만원 한도"
    note: "Q12(상급종합 80,000원)의 답이 4세대 60,000원 → 5세대 32,000원으로 바뀐다. 문항에 generation 필수."

# ── 중도상환수수료 제도 변경 이력 ───────────────────────────────────────
prepayment_fee_policy:
  history:
    - date: "2025-01-13"
      change: "실비용 원칙 개편 발표"
    - date: "2025-09-12"
      change: "적용 방식 조정"
    - date: "2026-01-01"
      change: "추가 조정"
  application_rule: "약정 시점 기준 적용(KB 표기)"
  caveat: |
    하나은행 2025.01 개정 설명서는 개편 전 요율 1.4% 예시를 그대로 싣고 있다.
    따라서 '현재 요율'을 묻는 질문에 이 문서를 근거로 단정하면 오답이다.
    문서의 basis_date 와 질문의 기준일을 함께 보고 답해야 한다.

# ── 계산 가능/불가 경계 ─────────────────────────────────────────────────
calculable:
  # 주의: YAML 에서 yes/no 는 불리언으로 읽힌다. 키 이름은 문자열로 둔다.
  supported:
    - 실손 자기부담금
    - 암 진단비 감액(가입 후 1년 미만 50%)
    - 납입면제 해당 여부 판정
    - 적금 중도해지이율
    - 대출 중도상환수수료
    - 연체이자(가산 + 캡)
    - 해외이용 원화청구금액
  unsupported:
    - name: 해지환급금
      reason: "산출방법서 영역. 약관에는 예시표만 있다."
      correct_answer: "예시표 인용 + 보험사 확인 안내"
    - name: 보험료
      reason: "산출방법서 영역"
      correct_answer: "예시표 인용 + 보험사 확인 안내"
    - name: 개인별 리볼빙·카드론 적용 이자율
      reason: "신용점수별 범위만 공시"
      correct_answer: "범위 제시 + 개인 확정 불가 명시"
